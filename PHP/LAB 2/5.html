<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">

		body{
			display: flex;
			text-align: center;
			align-items: center;
			justify-content: center;
			height: 97vh;
		}
		button{
			background-color: darkblue;
			color: whitesmoke;
		}
		form{
			
			width: 50%;
			border: solid ;
			text-align: center;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			background-color: hotpink;
		}
		button{
			width: 92px;
			border-radius: 36px;
		}
		
	</style>
</head>
<body>
		<form>
			<label>Username</label>
			<input type="name"><br><br>

			<label>E-Mail</label>
			<input type="email"><br><br>

			<label>Phone Number</label>
			<input type="tel"><br><br>

			<label>Gender</label>
			<input type="radio" name="Gender">Male
			<input type="radio" name="Gender">Female
			<input type="radio" name="Gender">Other<br><br>

			<label>Sem</label>
			<select>
				<option>1/2</option>
				<option>3/4</option>
				<option>5/6</option>
			</select><br><br>

			<label>Branch</label>
			<select>
				<option>Diploma</option>
				<option>Degree</option>
				<option>Management</option>
			</select><br><br>

			<label>Address</label>
			<input type="textarea"><br><br>

			<label>Hobbies</label><br>
			Music<input type="checkbox">
			Dancing<input type="checkbox">
			None of the Above<input type="checkbox"><br><br>

			<button>Login</button>
		</form>
</body>
</html>
